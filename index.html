<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>土味情话大全 | ai4kid.cn/oc/visitor</title>
    <meta
      name="description"
      content="土味情话大全：搜索、分类、随机抽取、收藏和一键复制适合聊天开场、表白、早晚安的甜句。"
    />
    <link rel="canonical" href="https://example.com" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar" aria-label="网站标题">
        <a class="brand" href="./" aria-label="土味情话大全首页">
          <img src="./assets/favicon.svg" alt="" width="34" height="34" />
          <span>土味情话大全</span>
        </a>
        <div class="stats" aria-label="情话统计">
          <span id="totalCount">131</span>
          <span>句甜度库存</span>
        </div>
      </header>

      <main>
        <section class="hero" aria-labelledby="pageTitle">
          <div class="hero-copy">
            <p class="eyebrow">ai4kid.cn/oc/visitor</p>
            <h1 id="pageTitle">想说甜一点，就从这里挑一句。</h1>
            <div class="hero-actions" aria-label="快捷操作">
              <button class="primary-btn" id="randomTopBtn" type="button">
                随机来一句
              </button>
              <button class="ghost-btn" id="showFavoritesBtn" type="button">
                我的收藏
              </button>
            </div>
            <p class="quick-result" id="quickResult">你知道我缺什么吗？缺点你。</p>
          </div>
          <figure class="hero-art">
            <img src="./assets/love-notes.svg" alt="写着情话的便签和聊天气泡插画" />
          </figure>
        </section>

        <section class="workspace" aria-label="情话工具">
          <aside class="panel generator" aria-labelledby="generatorTitle">
            <div class="panel-head">
              <p class="eyebrow">今日灵感</p>
              <h2 id="generatorTitle">现成一句</h2>
            </div>
            <blockquote id="featuredQuote">你知道我缺什么吗？缺点你。</blockquote>
            <div class="generator-actions">
              <button class="icon-btn" id="copyFeaturedBtn" type="button" aria-label="复制今日灵感">
                复制
              </button>
              <button class="icon-btn" id="refreshFeaturedBtn" type="button" aria-label="换一句">
                换一句
              </button>
            </div>
          </aside>

          <section class="panel customizer" aria-labelledby="customTitle">
            <div class="panel-head">
              <p class="eyebrow">定制口吻</p>
              <h2 id="customTitle">把名字放进情话里</h2>
            </div>
            <form id="customForm" class="custom-form">
              <label>
                <span>对方称呼</span>
                <input id="nameInput" type="text" maxlength="12" placeholder="例如：可可" />
              </label>
              <label>
                <span>风格</span>
                <select id="styleSelect">
                  <option value="甜">甜一点</option>
                  <option value="皮">皮一点</option>
                  <option value="稳">认真一点</option>
                </select>
              </label>
              <button class="primary-btn" type="submit">生成</button>
            </form>
            <div class="custom-result" id="customResult" aria-live="polite"></div>
          </section>
        </section>

        <section class="filters" aria-label="筛选土味情话">
          <label class="searchbox">
            <span>搜索</span>
            <input
              id="searchInput"
              type="search"
              placeholder="输入关键词，如 星星、月亮、喜欢"
              autocomplete="off"
            />
          </label>
          <div class="segments" id="categoryTabs" role="tablist" aria-label="分类"></div>
        </section>

        <section class="quote-grid" id="quoteGrid" aria-live="polite">
          <article class="quote-card">
            <mark>经典土味</mark>
            <p>你知道我缺什么吗？缺点你。</p>
            <div class="card-actions">
              <button class="icon-btn" type="button">复制</button>
              <button class="icon-btn" type="button">收藏</button>
            </div>
          </article>
          <article class="quote-card">
            <mark>甜到犯规</mark>
            <p>我最近有点忙，忙着喜欢你。</p>
            <div class="card-actions">
              <button class="icon-btn" type="button">复制</button>
              <button class="icon-btn" type="button">收藏</button>
            </div>
          </article>
          <article class="quote-card">
            <mark>表白冲刺</mark>
            <p>遇见你之后，我的人生建议只有一个：和你在一起。</p>
            <div class="card-actions">
              <button class="icon-btn" type="button">复制</button>
              <button class="icon-btn" type="button">收藏</button>
            </div>
          </article>
        </section>
      </main>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
